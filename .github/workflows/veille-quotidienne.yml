name: Radar · veille de 8 h et 18 h et publication du site

on:
  schedule:
    - cron: '0 8,18 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ligne-de-veille-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Collecter les actualités et les images officielles
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/update-news.py
      - name: Actualiser le suivi des trois dossiers de conflits
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/update-conflicts.py
      - name: Vérifier le suivi des dossiers
        run: node scripts/check-conflicts.cjs
      - name: Valider et préparer les actualités
        run: node scripts/build-news.mjs
      - name: Vérifier le catalogue et ses photos
        run: node scripts/check-catalog.mjs
      - name: Conserver la veille dans le dépôt
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "Radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualites.json actualites.js conflits-actualites.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualise les actualités et les dossiers de conflits"
            git push
          fi
      - name: Préparer les fichiers publics
        run: |
          node scripts/build-site.mjs
          node scripts/optimize-static.mjs _site
          node scripts/check-public-site.mjs _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
